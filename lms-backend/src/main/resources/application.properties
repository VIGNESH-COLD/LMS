# Server
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:viki0812N@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=${JWT_SECRET:LMS_SUPER_SECRET_KEY_2026_CHANGE_IN_PRODUCTION_MIN_256_BITS_LONG_ENOUGH}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:uploads}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Groq AI Chatbot
app.groq.api-url=https://api.groq.com/openai/v1/chat/completions
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
